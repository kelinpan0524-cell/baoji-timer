# CI + 出包发布：
# - PR / 手动触发：只跑静态检查和单测
# - push 到 main：检查通过后构建签名 APK，发布为 GitHub Release（tag = b<运行号>）
#   App 端（设置页"应用更新"）据此检查并原地覆盖升级。
# 签名密钥存 GitHub 机密（KEYSTORE_BASE64 等），与手机上已装版本的签名一致，
# 因此 CI 出的包可直接覆盖安装，训练数据不丢。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes 需要最近提交记录
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: 还原签名（无 key.properties 时 gradle 自动回退调试签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: 构建 APK（构建号 = CI 运行号，App 内据此判断是否更新）
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          TAG="b${{ github.run_number }}"
          {
            echo "薄肌训练计时器 v${VERSION}（构建 ${{ github.run_number }}）"
            echo
            echo "## 最近变更"
            git log --oneline -10
          } > notes.md
          gh release create "$TAG" \
            --title "v${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            "build/app/outputs/flutter-apk/app-release.apk#baoji-timer-${TAG}.apk"
